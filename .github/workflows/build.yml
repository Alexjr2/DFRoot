name: Build CI/CD

on:
  workflow_dispatch:
    inputs:
      TAG:
        description: 'TAG Required'
        required: true

permissions:
    contents: write

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@main

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@main
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main

      - name: Download DF LKMs
        uses: actions/download-artifact@main
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@main

      - name: Build DFRoot APK
        run: ./gradlew :app:assembleRelease

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@main
        with:
          name: DFRoot
          path: app/build/outputs/apk/release/DFRoot_*.apk

      - name: Create Release
        uses: ncipollo/release-action@main
        with:
          tag: ${{ github.event.inputs.TAG }}
          name: DFroot
          allowUpdates: true
          artifacts: app/build/outputs/apk/release/DFRoot_*.apk
